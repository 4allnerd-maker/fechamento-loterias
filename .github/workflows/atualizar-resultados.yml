name: Atualizar resultados

on:
  schedule:
    # 02:30 UTC = 23:30 em Brasília (sem horário de verão)
    - cron: '30 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar novos resultados
        run: node scripts/fetch-resultados.mjs

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada para atualizar."
          else
            git commit -m "Atualiza resultados automaticamente"
            git push
          fi
